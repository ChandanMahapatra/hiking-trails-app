<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>

  <meta name='theme-color' content='#b5e2c1'>
  <meta name='description' content='Hiking trails Swiss National Park'>
  <meta name='author' content='Raluca Nicola, ESRI'>

  <link rel="apple-touch-icon" sizes="57x57" href="./src/img/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="./src/img/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="./src/img/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="./src/img/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="./src/img/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="./src/img/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="./src/img/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="./src/img/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./src/img/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192"  href="./src/img/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./src/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="./src/img/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./src/img/favicon-16x16.png">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
  <meta name="theme-color" content="#ffffff">

  <meta name='apple-mobile-web-app-title' content='Hiking trails'>
  <meta name='mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-status-bar-style' content='#b5e2c1'>

  <title>Hiking trails</title>

  <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300,700' rel='stylesheet'>
  <script>
    // Prevent duplicate Calcite runtimes from redefining calciteConfig.version.
    window.calciteConfig = window.calciteConfig || {
      version: "preinitialized",
      logLevel: "info",
      focusTrapStack: []
    };
  </script>
  <script type='module' src='./src/ts/main.ts'></script>
</head>

<body>
  <header class="appHeader">
    <h1>Hiking Trails Explorer</h1>
    <div class="headerActions">
      <calcite-label layout="inline" class="viewModeControl">
        3D
        <calcite-switch id="viewModeToggle"></calcite-switch>
        2D
      </calcite-label>
    </div>
  </header>

  <div id='scenePanel'></div>

  <div class='menuPanel'>
    <h2 class='panelTitle'>Parks and Trails</h2>

    <div id='selectionPanel' class='panel'>
      <div id="selectionLoading" class="panelLoading" aria-live="polite">
        <calcite-loader id="selectionLoader" type="indeterminate" text="Loading parks and trails"></calcite-loader>
        <p id="selectionLoadingMessage">Loading park and trail names...</p>
      </div>

      <calcite-label id="parkSelectLabel">
        National Park
        <calcite-combobox id="parkSelect" selection-mode="single" overlay-positioning="fixed" filter-type="contains" placeholder="Search and select a national park"></calcite-combobox>
      </calcite-label>
      <calcite-label id="trailSelectLabel">
        Trail
        <calcite-combobox id="trailSelect" selection-mode="single" overlay-positioning="fixed" filter-type="contains" placeholder="Search and select a trail"></calcite-combobox>
      </calcite-label>

      <div id='detailPanel'>
        <h3 class='center' id='detailTitle'></h3>
        <div id='detailInfograph'></div>
        <div id='detailDescription'></div>
        <div id='detailElevationProfile'></div>
      </div>
    </div>

  </div>
</body>

</html>
