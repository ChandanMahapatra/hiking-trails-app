<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>

  <meta name='description' content='Explore hiking trails across U.S. National Parks in 3D and 2D with live trail details and elevation profiles.'>
  <meta name='author' content='Raluca Nicola, ESRI'>

  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="./ms-icon-144x144.png">
  <meta name="theme-color" content="#ffffff">

  <meta name='apple-mobile-web-app-title' content='US Hiking Trails Explorer'>
  <meta name='mobile-web-app-capable' content='yes'>
  <meta name='apple-mobile-web-app-status-bar-style' content='#b5e2c1'>

  <title>US Hiking Trails Explorer</title>

  <link rel="stylesheet" href="./src/style/app.css">
  <script>
    // Prevent duplicate Calcite runtimes from redefining calciteConfig.version.
    window.calciteConfig = window.calciteConfig || {
      version: "preinitialized",
      logLevel: "info",
      focusTrapStack: []
    };
  </script>
  <script type='module' src='./src/ts/main.ts'></script>
</head>

<body>
  <header class="appHeader">
    <div class="appHeaderBrand">
      <calcite-icon icon="tour-pin-tear" scale="m" aria-hidden="true"></calcite-icon>
      <h1>US Hiking Trails Explorer</h1>
    </div>
    <div class="headerActions">
      <calcite-label layout="inline" class="viewModeControl">
        3D
        <calcite-switch id="viewModeToggle" label="Switch between 3D and 2D map views"></calcite-switch>
        2D
      </calcite-label>
    </div>
  </header>

  <main id='scenePanel' aria-label='Interactive hiking trail map'>
    <section id="mapUnavailable" class="mapUnavailable" role="alert" hidden>
      <calcite-icon icon="exclamation-mark-triangle" scale="l" aria-hidden="true"></calcite-icon>
      <h2>Map unavailable in this browser</h2>
      <p>The interactive map needs WebGL 2 and hardware acceleration. Try reloading, updating your browser, or enabling hardware acceleration.</p>
      <calcite-button id="reloadMapButton" appearance="outline" icon-start="refresh">Reload map</calcite-button>
    </section>
  </main>
  <div id="mapControls" class="mapControls" aria-label="Map controls" hidden>
    <arcgis-home id="homeControl" label="Home"></arcgis-home>
    <arcgis-zoom id="zoomControl" label="Zoom"></arcgis-zoom>
    <arcgis-compass id="compassControl" label="Compass"></arcgis-compass>
    <arcgis-navigation-toggle id="navigationToggleControl" label="Navigation toggle" hidden></arcgis-navigation-toggle>
    <arcgis-expand
      id="basemapExpandControl"
      label="Basemap gallery"
      expand-icon="basemap"
      mode="floating"
      placement="bottom-end"
    >
      <arcgis-basemap-gallery id="basemapGalleryControl" label="Basemap gallery"></arcgis-basemap-gallery>
    </arcgis-expand>
    <arcgis-expand
      id="legendExpandControl"
      label="Legend"
      expand-icon="legend"
      mode="floating"
      placement="bottom-end"
    >
      <arcgis-legend id="legendControl" label="Legend"></arcgis-legend>
    </arcgis-expand>
  </div>

  <aside class='menuPanel' aria-label='Park and trail selection'>
    <h2 class='panelTitle'>Parks and Trails</h2>

    <div id='selectionPanel' class='panel'>
      <div id="selectionLoading" class="panelLoading" aria-live="polite">
        <calcite-loader id="selectionLoader" type="indeterminate" text="Loading parks and trails"></calcite-loader>
        <p id="selectionLoadingMessage">Loading park and trail names...</p>
      </div>

      <calcite-label id="parkSelectLabel">
        National Park
        <calcite-combobox id="parkSelect" selection-mode="single" overlay-positioning="fixed" filter-type="contains" placeholder="Search and select a national park"></calcite-combobox>
      </calcite-label>
      <calcite-label id="trailSelectLabel">
        Trail
        <calcite-combobox id="trailSelect" selection-mode="single" overlay-positioning="fixed" filter-type="contains" placeholder="Search and select a trail"></calcite-combobox>
      </calcite-label>

      <div id='detailPanel'>
        <h3 class='center' id='detailTitle'></h3>
        <div id='detailInfograph'></div>
        <div id='detailDescription'></div>
        <div id='detailElevationProfile'></div>
      </div>
    </div>

  </aside>
</body>

</html>
